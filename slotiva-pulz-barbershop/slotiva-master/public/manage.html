<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Moje rezervace</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/assets/public.css">
  <script type="module" src="/assets/manage.js"></script>
</head>
<body>
  <div class="page">
    <div class="shell shell-narrow">
      <main class="manage" id="main">
        <div class="loading-screen" role="status"><span class="spinner" aria-hidden="true"></span><span class="sr-only">Načítám…</span></div>
      </main>
    </div>
  </div>
  <dialog class="dialog" id="cancel-dialog">
    <h3>Opravdu zrušit rezervaci?</h3>
    <p>Termín se uvolní pro ostatní a zmizí z kalendáře podniku. Tuto akci nelze vrátit.</p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" data-close>Ponechat</button>
      <button type="button" class="btn btn-danger" data-confirm>Ano, zrušit</button>
    </div>
  </dialog>
</body>
</html>
